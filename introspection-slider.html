<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate My Human</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  /* Subtle bg texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, #16213e 0%, #0f0f23 60%, #1a1a2e 100%);
    z-index: -1;
  }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* ── PIN WRAPPER ── */
  .pin {
    position: relative;
    width: 620px;
    background: #111;
    border-radius: 18px;
    border: 3px solid #444;
    box-shadow:
      0 0 0 1px #222,
      0 8px 32px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 20px 24px 22px;
    user-select: none;
  }

  /* battery nub */
  .pin::after {
    content: '';
    position: absolute;
    right: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 32px;
    background: #444;
    border-radius: 0 5px 5px 0;
    border: 2px solid #555;
    border-left: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }

  /* ── EMOTION FACES ROW ── */
  .faces-row {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
  }

  .face-cell {
    flex: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 4px 6px;
    transition: transform 0.2s ease, filter 0.3s ease;
    position: relative;
  }

  .face-cell.active {
    transform: scale(1.08);
    filter: brightness(1.25) drop-shadow(0 0 10px var(--cell-color));
  }

  .face-cell.inactive {
    filter: brightness(0.45) saturate(0.3);
  }

  /* cell colors */
  .face-cell:nth-child(1) { background: #c0392b; --cell-color: #e74c3c; }
  .face-cell:nth-child(2) { background: #c0396b; --cell-color: #e74c9b; }
  .face-cell:nth-child(3) { background: #c0496e; --cell-color: #e06080; }
  .face-cell:nth-child(4) { background: #d68910; --cell-color: #f39c12; }
  .face-cell:nth-child(5) { background: #1abc9c; --cell-color: #2ecc71; }
  .face-cell:nth-child(6) { background: #16a085; --cell-color: #1abc9c; }
  .face-cell:nth-child(7) { background: #1e8449; --cell-color: #27ae60; }

  /* ── SVG FACE ── */
  .face-svg {
    width: 52px;
    height: 52px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .face-cell.active .face-svg {
    transform: scale(1.1);
  }

  /* ── TRACK & SLIDER ── */
  .track-wrapper {
    position: relative;
    margin-top: 4px;
    height: 36px;
    display: flex;
    align-items: center;
  }

  .track-bg {
    position: absolute;
    left: 0; right: 0;
    height: 18px;
    border-radius: 9px;
    background: #222;
    border: 2px solid #444;
    overflow: hidden;
  }

  .track-fill {
    height: 100%;
    border-radius: 9px;
    transition: width 0.1s ease, background 0.4s ease;
    /* 7 color stops across the track */
    background: var(--track-color, #c0392b);
  }

  /* colored tick marks below track */
  .track-ticks {
    position: absolute;
    left: 0; right: 0;
    bottom: -6px;
    height: 6px;
    display: flex;
    gap: 3px;
  }

  .tick {
    flex: 1;
    border-radius: 2px;
    opacity: 0.7;
  }
  .tick:nth-child(1) { background: #c0392b; }
  .tick:nth-child(2) { background: #c0396b; }
  .tick:nth-child(3) { background: #c0496e; }
  .tick:nth-child(4) { background: #d68910; }
  .tick:nth-child(5) { background: #1abc9c; }
  .tick:nth-child(6) { background: #16a085; }
  .tick:nth-child(7) { background: #1e8449; }

  /* The draggable thumb — person photo */
  .thumb {
    position: absolute;
    width: 56px;
    height: 80px;
    cursor: grab;
    z-index: 10;
    transform: translate(-50%, -60%);
    top: 50%;
    transition: filter 0.2s, transform 0.15s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    will-change: left;
  }

  .thumb:active { cursor: grabbing; transform: translate(-50%, -62%) scale(1.08); }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50% 50% 0 0 / 60% 60% 0 0;
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 16px rgba(0,0,0,0.7), 0 0 12px rgba(255,255,255,0.15);
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  }

  /* ── LABEL ── */
  .pin-label {
    text-align: center;
    margin-top: 18px;
    font-size: 17px;
    letter-spacing: 0.04em;
    color: #ddd;
    font-weight: 600;
  }

  /* ── MOOD READOUT below the pin ── */
  .mood-readout {
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  .mood-name {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.02em;
    transition: color 0.4s ease;
    text-shadow: 0 0 30px currentColor;
  }

  .mood-sub {
    font-size: 14px;
    color: #888;
    margin-top: 4px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* bounce anim on face change */
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.2); }
    70%  { transform: scale(0.95); }
    100% { transform: scale(1.1); }
  }

  .face-cell.active .face-svg.popping {
    animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
</style>
</head>

    <div class="pin-label">rate my human</div>

  <!-- MOOD DISPLAY -->
  <div class="mood-readout">
    <div class="mood-name" id="moodName">—</div>
    <div class="mood-sub" id="moodSub">drag yourself to introspect</div>
  </div>
</div>

<script>
const MOODS = [
  { name: "Ghost Mode",      sub: "lights on, nobody home",   color: "#e74c3c",
    face: (s) => angryFace(s) },
  { name: "Prickly",        sub: "everything was an issue",  color: "#e74c9b",
    face: (s) => frownFace(s) },
  { name: "Checked Out",    sub: "half here, half elsewhere", color: "#e06080",
    face: (s) => uneaseFace(s) },
  { name: "Decent",         sub: "met the bar, barely",      color: "#f39c12",
    face: (s) => neutralFace(s) },
  { name: "Warm",           sub: "small things, big difference", color: "#2ecc71",
    face: (s) => pursedFace(s) },
  { name: "Good",           sub: "pretty solid actually",    color: "#1abc9c",
    face: (s) => smileFace(s) },
  { name: "Main Character", sub: "absolutely stole the show", color: "#27ae60",
    face: (s) => bigSmileFace(s) },
];

/* ── SVG face generators ── */
function baseFace(extra) {
  return `<svg class="face-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="26" fill="#f5f0e8" stroke="#ddd" stroke-width="1.5"/>
    <!-- eyes -->
    <circle cx="20" cy="24" r="3" fill="#222"/>
    <circle cx="40" cy="24" r="3" fill="#222"/>
    <!-- eye shine -->
    <circle cx="21.5" cy="22.5" r="1.2" fill="white"/>
    <circle cx="41.5" cy="22.5" r="1.2" fill="white"/>
    ${extra}
  </svg>`;
}

function angryFace(s) {
  return baseFace(`
    <line x1="15" y1="19" x2="25" y2="22" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="19" x2="35" y2="22" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 40 Q30 33 40 40" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  `);
}
function frownFace(s) {
  return baseFace(`
    <path d="M18 40 Q30 32 42 40" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  `);
}
function uneaseFace(s) {
  return baseFace(`
    <path d="M19 38 Q24 35 29 37 Q34 39 41 36" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  `);
}
function neutralFace(s) {
  return baseFace(`
    <line x1="20" y1="38" x2="40" y2="38" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  `);
}
function pursedFace(s) {
  return baseFace(`
    <circle cx="30" cy="38" r="3" fill="#e8a0a0"/>
    <path d="M24 38 Q30 36 36 38" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
  `);
}
function smileFace(s) {
  return baseFace(`
    <path d="M20 36 Q30 44 40 36" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="33" r="3" fill="rgba(255,140,140,0.4)"/>
    <circle cx="38" cy="33" r="3" fill="rgba(255,140,140,0.4)"/>
  `);
}
function bigSmileFace(s) {
  return baseFace(`
    <path d="M18 34 Q30 46 42 34" stroke="#222" stroke-width="2.5" fill="#f5a0a0" stroke-linecap="round"/>
    <circle cx="22" cy="31" r="4" fill="rgba(255,130,130,0.45)"/>
    <circle cx="38" cy="31" r="4" fill="rgba(255,130,130,0.45)"/>
    <!-- teeth -->
    <path d="M20 34 Q30 42 40 34" fill="white"/>
  `);
}

/* ── Build faces ── */
const facesRow = document.getElementById('facesRow');
MOODS.forEach((m, i) => {
  const cell = document.createElement('div');
  cell.className = 'face-cell';
  cell.innerHTML = m.face(i);
  facesRow.appendChild(cell);
});

const cells = document.querySelectorAll('.face-cell');
const svgs = document.querySelectorAll('.face-svg');

/* ── Slider logic ── */
const trackWrapper = document.getElementById('trackWrapper');
const thumb = document.getElementById('thumb');
const trackFill = document.getElementById('trackFill');
const moodName = document.getElementById('moodName');
const moodSub  = document.getElementById('moodSub');

let isDragging = false;
let currentIdx = -1;

function getTrackBounds() {
  const rect = trackWrapper.getBoundingClientRect();
  // thumb can go from 0% to 100%
  return { left: rect.left, width: rect.width };
}

function setPosition(clientX) {
  const { left, width } = getTrackBounds();
  let ratio = (clientX - left) / width;
  ratio = Math.max(0, Math.min(1, ratio));

  // snap to 7 segments
  const segment = 1 / 7;
  const idx = Math.min(6, Math.floor(ratio / segment));
  const pct = ratio * 100;

  // Update thumb
  thumb.style.left = `${pct}%`;

  // Update fill
  const colors = MOODS.map(m => m.color);
  trackFill.style.width = `${pct}%`;
  trackFill.style.background = colors[idx];

  // Update mood readout
  if (idx !== currentIdx) {
    currentIdx = idx;
    updateMood(idx);
  }
}

function updateMood(idx) {
  const m = MOODS[idx];
  moodName.textContent = m.name;
  moodName.style.color = m.color;
  moodSub.textContent = m.sub;

  cells.forEach((c, i) => {
    c.classList.remove('active', 'inactive');
    if (i === idx) {
      c.classList.add('active');
      // pop animation
      const svg = c.querySelector('.face-svg');
      svg.classList.remove('popping');
      void svg.offsetWidth; // reflow
      svg.classList.add('popping');
    } else {
      c.classList.add('inactive');
    }
  });
}

// init position at neutral (index 3)
function init() {
  const segment = 1 / 7;
  const initRatio = segment * 3.5; // middle of segment 3
  thumb.style.left = `${initRatio * 100}%`;
  trackFill.style.width = `${initRatio * 100}%`;
  trackFill.style.background = MOODS[3].color;
  updateMood(3);
  currentIdx = 3;
}

/* mouse events */
thumb.addEventListener('mousedown', e => {
  isDragging = true;
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  setPosition(e.clientX);
});

document.addEventListener('mouseup', () => { isDragging = false; });

/* touch events */
thumb.addEventListener('touchstart', e => {
  isDragging = true;
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  setPosition(e.touches[0].clientX);
}, { passive: false });

document.addEventListener('touchend', () => { isDragging = false; });

/* click on track to jump */
trackWrapper.addEventListener('click', e => {
  if (e.target === thumb || thumb.contains(e.target)) return;
  setPosition(e.clientX);
});

init();
</script>
